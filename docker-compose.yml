services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/taskly.db
      SECRET_KEY: ${SECRET_KEY:-change-this-compose-secret}
    volumes:
      - taskly_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  taskly_data:
